[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camrie-tools"
version = "0.1.0"
description = "Python tools for CAMRIE, including the Koma MRI simulation pipeline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "SimpleITK",
    "numpy",
    "vtk",
    "tqdm",
    "pypulseq",
    "matplotlib",
]

[project.optional-dependencies]
app = ["streamlit", "plotly"]
hdf5 = ["h5py"]

[project.scripts]
camrie-koma-pipeline = "camrie_tools.MRI_pipeline:main"
camrie-install-julia = "camrie_tools._julia:main"
camrie-test-installation = "camrie_tools._installation_check:main"
camrie-example = "camrie_tools._example:main"
camrie-reconstruction-smoke = "camrie_tools._reconstruction_smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["MRI_pipeline"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["camrie_tools*"]

[tool.setuptools.package-data]
camrie_tools = ["simulate_batch.jl", "sequences/*"]
