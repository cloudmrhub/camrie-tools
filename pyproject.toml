[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "camrie-tools"
version = "0.1.0"
description = "Advanced MRI Image Simulation and Planning Tools"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CAMRIE Team", email = "info@camrie.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["MRI", "simulation", "medical imaging", "Bloch equations", "camrie"]
dependencies = [
    "numpy>=1.21.0",
    "SimpleITK>=2.1.0", 
    "scipy>=1.7.0",
    "nibabel>=3.2.0",
    "pydicom>=2.3.0",
    "pypulseq>=1.3.0",
    "tqdm>=4.62.0",
    "matplotlib>=3.5.0",
    "pillow>=8.0.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
interactive = [
    "streamlit>=1.20.0",
    "plotly>=5.14.0", 
    "pyvista>=0.39.0",
    "vtk>=9.1.0",
]
cloud = [
    "boto3>=1.26.0",
    "docker>=6.0.0",
    "awscli>=1.29.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0", 
    "isort>=5.12.0",
    "sphinx>=5.0.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]
all = [
    "camrie-tools[interactive,cloud,dev]"
]

[project.urls]
Homepage = "https://github.com/yourusername/camrie-tools"
Repository = "https://github.com/yourusername/camrie-tools.git"
Documentation = "https://camrie-tools.readthedocs.io" 
"Bug Tracker" = "https://github.com/yourusername/camrie-tools/issues"

[project.scripts]
camrie-sim = "camrie.cli:main_simulation"
camrie-streamlit = "camrie.cli:main_streamlit"  
camrie-setup = "camrie.cli:main_setup"
camrie-notebook = "camrie.cli:main_notebook"

[tool.setuptools.packages.find]
where = ["."]
include = ["camrie*"]

[tool.setuptools.package-data]
camrie = ["data/*", "julia/*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3
